services:
  nexora-drive:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexora-drive-game
    image: nexora-drive:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
